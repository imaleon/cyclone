<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Tetris Online PvP</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="overlay">
    <h1 id="overlayText">
        WAITING FOR PLAYER
    </h1>
</div>

<div class="wrapper">

    <div class="player-area">
        <h2>YOU</h2>

        <canvas
            id="playerCanvas"
            width="200"
            height="400">
        </canvas>
    </div>

    <div class="player-area">
        <h2>ENEMY</h2>

        <canvas
            id="enemyCanvas"
            width="200"
            height="400">
        </canvas>
    </div>

</div>

<div class="controls">
    ← → Move |
    ↑ Rotate |
    ↓ Soft Drop |
    SPACE Hard Drop
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="network.js"></script>
<script src="game.js"></script>

</body>
</html>
